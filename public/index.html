<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickChat — Ingen registrering kræves</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ── Reset & variables ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #111111;
      --bg2:       #1a1a1a;
      --bg3:       #222222;
      --border:    #333333;
      --gray:      #555555;
      --gray-lt:   #888888;
      --text:      #dddddd;
      --text-dim:  #888888;
      --orange:    #e87722;
      --orange-dk: #b85c10;
      --orange-lt: #f09a50;
      --red:       #cc2200;
      --red-lt:    #ff4422;
      --red-bg:    #1a0500;
      --radius:    8px;
      --shadow:    0 4px 20px rgba(0,0,0,.5);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    a { color: var(--orange); text-decoration: none; }
    a:hover { color: var(--orange-lt); }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      transition: background .15s, transform .1s;
    }
    button:active { transform: scale(.97); }

    input, textarea {
      font-family: inherit;
      font-size: 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--orange); }

    /* ── Screens ─────────────────────────────────────────────────────── */
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── LOBBY ───────────────────────────────────────────────────────── */
    #lobby { background: var(--bg); }

    .lobby-header {
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      border-bottom: 2px solid var(--orange);
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
    }

    .lang-switcher {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-size: .82rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .lang-btn:hover { border-color: var(--orange); color: var(--orange-lt); }
    .lang-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }
    .logo {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
    }
    .logo span { color: var(--orange); }
    .tagline {
      color: var(--gray-lt);
      margin-top: 6px;
      font-size: .95rem;
    }

    .welcome-strip { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); margin: 24px auto; max-width: 780px; padding: 20px 28px; font-size: .95rem; color: var(--text-dim); line-height: 1.7; }
    .welcome-strip strong { color: var(--orange); }

    .btn-how {
      display: block;
      margin: -12px auto 28px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--gray-lt);
      font-size: .82rem;
      padding: 6px 18px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-how:hover { border-color: var(--orange); color: var(--orange-lt); }

    /* ── How it works modal ── */
    .hiw-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      display: none;
    }
    .hiw-overlay.show { display: flex; }
    .hiw-modal {
      background: var(--bg2);
      border: 1px solid var(--orange);
      border-radius: var(--radius);
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 36px 40px;
      position: relative;
    }
    .hiw-modal::-webkit-scrollbar { width: 4px; }
    .hiw-modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    .hiw-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none;
      border: none;
      color: var(--gray-lt);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .hiw-close:hover { color: #fff; }
    .hiw-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .hiw-subtitle {
      color: var(--orange);
      font-size: .9rem;
      margin-bottom: 28px;
    }
    .hiw-section {
      margin-bottom: 24px;
    }
    .hiw-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .hiw-icon {
      font-size: 1.3rem;
      width: 36px; height: 36px;
      background: var(--bg3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hiw-section p {
      color: var(--text-dim);
      font-size: .9rem;
      line-height: 1.7;
      margin-left: 46px;
    }
    .hiw-section p strong { color: var(--text); }
    .hiw-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }
    .hiw-footer {
      background: var(--bg3);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: .82rem;
      color: var(--gray-lt);
      line-height: 1.6;
    }
    .hiw-footer strong { color: var(--orange); }

    .nick-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto 32px;
      padding: 0 16px;
    }
    .nick-bar input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
    }
    .nick-bar .btn-join {
      background: var(--orange);
      color: #fff;
      padding: 10px 20px;
      font-weight: 600;
      white-space: nowrap;
    }
    .nick-bar .btn-join:hover { background: var(--orange-lt); }

    .rooms-heading {
      text-align: center;
      font-size: 1.1rem;
      color: var(--gray-lt);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-size: .8rem;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    .room-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      transition: border-color .2s, transform .15s, background .2s;
      position: relative;
      overflow: hidden;
    }
    .room-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,119,34,.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .2s;
    }
    .room-card:hover { border-color: var(--orange); transform: translateY(-2px); }
    .room-card:hover::before { opacity: 1; }
    .room-card.full { opacity: .45; cursor: not-allowed; }
    .room-card.full:hover { transform: none; border-color: var(--border); }
    .room-card.full:hover::before { opacity: 0; }

    .room-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .room-name { font-weight: 700; font-size: 1rem; color: #fff; }
    .room-desc { font-size: .82rem; color: var(--text-dim); margin-top: 4px; }

    .room-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    .room-count {
      font-size: .78rem;
      color: var(--gray-lt);
    }
    .room-count.hot { color: var(--orange); }
    .room-count.full { color: var(--red-lt); }
    .room-meter {
      flex: 1;
      height: 4px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    .room-meter-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 99px;
      transition: width .4s;
    }
    .room-meter-fill.hot { background: var(--orange-lt); }
    .room-meter-fill.full { background: var(--red-lt); }

    /* error toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2a0a0a;
      border: 1px solid var(--red);
      color: var(--red-lt);
      padding: 10px 22px;
      border-radius: 99px;
      font-size: .9rem;
      transition: transform .3s;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── CHAT ROOM ────────────────────────────────────────────────────── */
    #chatroom {
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .chat-outer {
      display: flex;
      flex: 1;
      overflow: hidden;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-ad-col {
      width: 170px;
      flex-shrink: 0;
      padding: 16px 10px;
      background: var(--bg);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .ad-placeholder {
      width: 150px;
      height: 600px;
      background: var(--bg2);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--gray);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .ad-placeholder span:first-child {
      font-size: .65rem;
      color: var(--border);
    }

    @media (max-width: 1000px) { .chat-ad-col { display: none; } }

    .chat-topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn-back {
      background: var(--bg3);
      color: var(--text);
      padding: 6px 14px;
      border: 1px solid var(--border);
      font-size: .85rem;
    }
    .btn-back:hover { border-color: var(--orange); color: var(--orange); }

    .chat-room-title {
      flex: 1;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .chat-room-title small {
      display: block;
      font-size: .75rem;
      font-weight: 400;
      color: var(--text-dim);
    }

    .btn-users {
      background: var(--bg3);
      color: var(--gray-lt);
      padding: 6px 12px;
      border: 1px solid var(--border);
      font-size: .85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-users:hover { border-color: var(--orange); color: var(--orange); }

    .chat-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Messages pane */
    .messages-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    .messages-list::-webkit-scrollbar { width: 6px; }
    .messages-list::-webkit-scrollbar-track { background: transparent; }
    .messages-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .msg {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background .15s;
    }
    .msg:hover { background: var(--bg3); }

    .msg-time {
      font-size: .72rem;
      color: var(--gray);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .msg-nick {
      font-weight: 700;
      color: var(--orange);
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .msg-nick:hover { color: var(--orange-lt); text-decoration: underline; }
    .msg-nick.self { color: #7ec8e3; }
    .msg-text { word-break: break-word; line-height: 1.5; }

    .msg.system {
      justify-content: center;
      color: var(--gray);
      font-size: .8rem;
      font-style: italic;
    }
    .msg.system .msg-nick, .msg.system .msg-time { display: none; }

    /* Input bar */
    .chat-input-bar {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg2);
    }
    .chat-input-bar input {
      flex: 1;
      padding: 10px 14px;
    }
    .btn-send {
      background: var(--orange);
      color: #fff;
      padding: 10px 20px;
      font-weight: 600;
    }
    .btn-send:hover { background: var(--orange-lt); }

    /* Users sidebar */
    .users-sidebar {
      width: 200px;
      border-left: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: width .25s;
    }
    .users-sidebar.hidden { width: 0; border: none; }

    .users-sidebar-head {
      padding: 12px 14px;
      font-size: .75rem;
      color: var(--gray-lt);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .user-item {
      padding: 6px 14px;
      font-size: .88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border-radius: 4px;
      margin: 0 6px;
      transition: background .15s;
    }
    .user-item:hover { background: var(--bg3); color: var(--orange); }
    .user-item.self { color: #7ec8e3; cursor: default; }
    .user-item.self:hover { background: transparent; color: #7ec8e3; }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #44cc66; flex-shrink: 0; }
    .user-dot.self { background: #7ec8e3; }

    /* ── PRIVATE CHAT ─────────────────────────────────────────────────── */
    .private-panel {
      position: fixed;
      bottom: 0;
      right: 24px;
      width: 320px;
      min-width: 240px;
      min-height: 44px;
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      height: 420px;
      z-index: 500;
      user-select: none;
    }
    .private-panel.collapsed { height: 44px !important; min-height: 44px; }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-handle.n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: n-resize; }
    .resize-handle.w  { left: -4px; top: 8px; bottom: 0; width: 8px; cursor: w-resize; }
    .resize-handle.nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nw-resize; }
    .resize-handle.ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: ne-resize; }

    .private-topbar {
      background: var(--red);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      border-radius: var(--radius) var(--radius) 0 0;
      flex-shrink: 0;
      user-select: none;
    }
    .private-topbar:active { cursor: grabbing; }
    .private-topbar-title {
      flex: 1;
      font-weight: 700;
      font-size: .88rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .private-topbar-badge {
      background: #ff0000;
      color: #fff;
      border-radius: 99px;
      padding: 1px 7px;
      font-size: .72rem;
      font-weight: 700;
      display: none;
    }
    .private-topbar-badge.show { display: block; }
    .private-mute {
      background: rgba(0,0,0,.3);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: .9rem;
      line-height: 1;
      cursor: pointer;
      transition: background .15s;
    }
    .private-mute:hover { background: rgba(0,0,0,.6); }
    .private-mute.muted { opacity: .5; }

    .private-close {
      background: rgba(0,0,0,.3);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }
    .private-close:hover { background: rgba(0,0,0,.6); }

    .private-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .private-messages::-webkit-scrollbar { width: 4px; }
    .private-messages::-webkit-scrollbar-thumb { background: var(--red); border-radius: 99px; }

    .private-msg {
      font-size: .87rem;
      line-height: 1.45;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .private-msg .pnick {
      font-weight: 700;
      color: var(--red-lt);
      cursor: default;
    }
    .private-msg .pnick.self { color: #f0a070; }
    .private-msg .ptext { color: #eec; word-break: break-word; }

    .private-input-bar {
      border-top: 1px solid var(--red);
      padding: 8px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      border-radius: 0 0 var(--radius) var(--radius);
      transition: background .2s, border-color .2s;
    }
    .private-input-bar.drag-over {
      background: rgba(204, 34, 0, .25);
      border-top-color: var(--red-lt);
      outline: 2px dashed var(--red-lt);
      outline-offset: -4px;
    }
    .private-input-bar input {
      flex: 1;
      padding: 7px 10px;
      background: rgba(0,0,0,.4);
      border-color: var(--red);
      font-size: .87rem;
      color: #eec;
    }
    .private-input-bar input::placeholder { color: #885544; }
    .private-input-bar input:focus { border-color: var(--red-lt); }
    .btn-private-send {
      background: var(--red);
      color: #fff;
      padding: 7px 12px;
      font-size: .85rem;
      font-weight: 600;
    }
    .btn-private-send:hover { background: var(--red-lt); }

    /* Private invite notification */
    .invite-banner {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      z-index: 600;
      transition: transform .3s;
      white-space: nowrap;
    }
    .invite-banner.show { transform: translateX(-50%) translateY(0); }
    .invite-banner-text { color: var(--red-lt); font-size: .9rem; }
    .btn-accept-invite {
      background: var(--red);
      color: #fff;
      padding: 5px 14px;
      font-size: .85rem;
    }
    .btn-accept-invite:hover { background: var(--red-lt); }
    .btn-dismiss-invite {
      background: var(--bg3);
      color: var(--gray-lt);
      padding: 5px 10px;
      font-size: .85rem;
      border: 1px solid var(--border);
    }

    /* Nick modal (context menu) */
    .nick-menu {
      position: fixed;
      background: var(--bg2);
      border: 1px solid var(--orange);
      border-radius: var(--radius);
      padding: 6px 0;
      min-width: 180px;
      box-shadow: var(--shadow);
      z-index: 700;
      display: none;
    }
    .nick-menu.show { display: block; }
    .nick-menu-title {
      padding: 6px 14px 8px;
      font-size: .8rem;
      color: var(--gray-lt);
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .nick-menu-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: .9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s;
    }
    .nick-menu-item:hover { background: var(--bg3); color: var(--orange); }
    .nick-menu-item.red:hover { color: var(--red-lt); }

    .btn-image {
      background: rgba(0,0,0,.3);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      color: #fff;
      padding: 7px 9px;
      font-size: .95rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    .btn-image:hover { background: var(--red); }

    .private-img-wrap {
      margin-top: 4px;
    }
    .private-img-wrap img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      border: 1px solid var(--red);
      cursor: zoom-in;
      display: block;
      margin-top: 4px;
      transition: opacity .2s;
    }
    .private-img-wrap img:hover { opacity: .85; }

    .btn-img-save {
      margin-top: 5px;
      background: rgba(0,0,0,.4);
      border: 1px solid var(--red);
      border-radius: 4px;
      color: #eec;
      font-size: .75rem;
      padding: 3px 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-img-save:hover { background: var(--red); color: #fff; }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      display: none;
    }
    .lightbox.show { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius);
      box-shadow: 0 0 40px rgba(0,0,0,.8);
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: .7;
    }
    .lightbox-close:hover { opacity: 1; }

    .img-sending {
      font-size: .78rem;
      color: var(--red-lt);
      font-style: italic;
      padding: 3px 6px;
    }
    @media (max-width: 580px) {
      .users-sidebar { display: none; }
      .private-panel { width: calc(100vw - 32px); right: 16px; }
      .room-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
    @media (max-width: 380px) {
      .room-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ─── LOBBY ──────────────────────────────────────────────────────────── -->
  <div id="lobby" class="screen active">
    <div class="lobby-header">
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="App.setLang('da')" id="langDa">🇩🇰 DA</button>
        <button class="lang-btn" onclick="App.setLang('en')" id="langEn">🇬🇧 EN</button>
      </div>
      <div class="logo">Quick<span>Chat</span></div>
      <div class="tagline" id="tagline"></div>
    </div>

    <div class="welcome-strip" id="welcomeStrip"></div>
    <button class="btn-how" id="btnHow" onclick="App.openHiw()"></button>

    <div class="nick-bar">
      <input id="nickInput" type="text" maxlength="20" autocomplete="off" />
      <button class="btn-join" onclick="App.setNickname()" id="btnSetName"></button>
    </div>

    <div class="rooms-heading" id="roomsHeading"></div>
    <div class="room-grid" id="roomGrid">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- ─── CHAT ROOM ───────────────────────────────────────────────────────── -->
  <div id="chatroom" class="screen">
    <div class="chat-topbar">
      <button class="btn-back" onclick="App.leaveRoom()" id="btnBack"></button>
      <div class="chat-room-title" id="chatRoomTitle">
        Room Name
        <small id="chatRoomDesc">description</small>
      </div>
      <button class="btn-users" onclick="App.toggleSidebar()">
        👥 <span id="userCount">0</span>/<span>20</span>
      </button>
    </div>

    <div class="chat-outer">

      <!-- Venstre reklame -->
      <div class="chat-ad-col" id="adLeft">
        <div class="ad-placeholder"><span>160 × 600</span><span>Reklame</span></div>
      </div>

      <div class="chat-body">
        <div class="messages-pane">
          <div class="messages-list" id="messagesList"></div>
          <div class="chat-input-bar">
            <input id="chatInput" type="text" maxlength="500" autocomplete="off" />
            <button class="btn-send" onclick="App.sendMessage()" id="btnSend"></button>
          </div>
        </div>

        <div class="users-sidebar" id="usersSidebar">
          <div class="users-sidebar-head" id="sidebarHead"></div>
          <div class="users-list" id="usersList"></div>
        </div>
      </div>

      <!-- Højre reklame -->
      <div class="chat-ad-col" id="adRight">
        <div class="ad-placeholder"><span>160 × 600</span><span>Reklame</span></div>
      </div>

    </div>
  </div>

  <!-- ─── Private panel ───────────────────────────────────────────────────── -->
  <div class="private-panel collapsed" id="privatePanel" style="display:none">
    <div class="resize-handle n"  data-dir="n"></div>
    <div class="resize-handle w"  data-dir="w"></div>
    <div class="resize-handle nw" data-dir="nw"></div>
    <div class="resize-handle ne" data-dir="ne"></div>
    <div class="private-topbar" onclick="App.togglePrivatePanel()">
      <div>🔴</div>
      <div class="private-topbar-title" id="privatePanelTitle">Privat</div>
      <div class="private-topbar-badge" id="privateUnread">1</div>
      <button class="private-mute" id="privateMuteBtn" onclick="App.toggleMute(event)" title="Slå lyd til/fra">🔔</button>
      <button class="private-close" onclick="App.closePrivate(event)">✕</button>
    </div>
    <div class="private-messages" id="privateMessages"></div>
    <div class="private-input-bar">
      <button class="btn-image" onclick="App.pickImage()" id="btnImage">🖼️</button>
      <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="App.sendImage(this)" />
      <input id="privateInput" type="text" maxlength="500" autocomplete="off" />
      <button class="btn-private-send" onclick="App.sendPrivate()" id="btnPrivateSend"></button>
    </div>
  </div>

  <!-- ─── Invite banner ───────────────────────────────────────────────────── -->
  <div class="invite-banner" id="inviteBanner">
    <div class="invite-banner-text" id="inviteText">Nogen vil gerne chatte privat</div>
    <button class="btn-accept-invite" onclick="App.acceptInvite()" id="btnAccept"></button>
    <button class="btn-dismiss-invite" onclick="App.dismissInvite()" id="btnDismiss"></button>
  </div>

  <!-- ─── Nick context menu ───────────────────────────────────────────────── -->
  <div class="nick-menu" id="nickMenu">
    <div class="nick-menu-title" id="nickMenuTitle">username</div>
    <div class="nick-menu-item red" onclick="App.openPrivate()">🔴 Privat chat</div>
  </div>

  <!-- ─── Lightbox ──────────────────────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" onclick="App.closeLightbox()">
    <div class="lightbox-close" onclick="App.closeLightbox()">✕</div>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <!-- ─── Toast ───────────────────────────────────────────────────────────── -->
  <div id="toast"></div>

  <script>
  const App = (() => {
    const socket = io();

    // Declared at top so applyLang() can always reference them
    let audioCtx   = null;
    let soundMuted = false;

    let state = {
      nickname:       '',
      currentRoom:    null,
      sidebarVisible: true,
      rooms:          [],
      // Private chat
      privateOpen:    false,
      privatePrId:    null,
      privateWith:    null,
      pendingInvite:  null,
      // Nick menu
      menuTarget:     null,
      privateUnread:  0,
      privateCollapsed: false,
    };

    // ── Screens ───────────────────────────────────────────────────────────
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── Toast ─────────────────────────────────────────────────────────────
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3500);
    }

    // ── Time format ───────────────────────────────────────────────────────
    function fmtTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ── Lobby / nickname ──────────────────────────────────────────────────
    function setNickname() {
      const v = document.getElementById('nickInput').value.trim();
      if (!v) return showToast(t('enterNick'));
      if (!/^[a-zA-Z0-9_\-]+$/.test(v)) return showToast(t('nickChars'));
      state.nickname = v;
      sessionStorage.setItem('quickchat_nick', v);
      showToast(t('nickSet', v));
    }

    function joinRoom(roomId) {
      if (!state.nickname) return showToast(t('setNickFirst'));
      const room = state.rooms.find(r => r.id === roomId);
      if (room && !room.available) return showToast(t('roomFull'));
      socket.emit('join-room', { roomId, nickname: state.nickname });
    }

    // ── Room list rendering ───────────────────────────────────────────────
    function renderRooms(rooms) {
      state.rooms = rooms;
      const grid = document.getElementById('roomGrid');
      grid.innerHTML = '';
      rooms.forEach(r => {
        const pct = Math.round((r.count / r.max) * 100);
        const hot  = r.count >= 10;
        const full = !r.available;
        const card = document.createElement('div');
        card.className = 'room-card' + (full ? ' full' : '');
        card.innerHTML = `
          <div class="room-icon">${r.iconImage && r.iconImage.startsWith('data:image/')
            ? `<img src="${r.iconImage}" alt="${escHtml(r.name)}" style="width:2rem;height:2rem;border-radius:6px;object-fit:cover;">`
            : escHtml(r.icon)}</div>
          <div class="room-name">${r.name}</div>
          <div class="room-desc">${r.description}</div>
          <div class="room-bar">
            <div class="room-count${full ? ' full' : hot ? ' hot' : ''}">
              ${full ? `🔴 ${t('full')}` : `${r.count}/${r.max}`}
            </div>
            <div class="room-meter">
              <div class="room-meter-fill${full ? ' full' : hot ? ' hot' : ''}" style="width:${pct}%"></div>
            </div>
          </div>`;
        if (!full) card.onclick = () => joinRoom(r.id);
        grid.appendChild(card);
      });
    }

    // ── Chat room ─────────────────────────────────────────────────────────
    function leaveRoom() {
      socket.emit('leave-room');
      closePrivateFull();
      state.currentRoom = null;
      document.getElementById('messagesList').innerHTML = '';
      showScreen('lobby');
      socket.emit('get-rooms');
    }

    function appendMessage(msg) {
      const list = document.getElementById('messagesList');
      const el   = document.createElement('div');
      el.className = 'msg ' + (msg.type || 'public');
      if (msg.type === 'system') {
        el.innerHTML = `<span>${escHtml(msg.message)}</span>`;
      } else {
        const isSelf = msg.nickname === state.nickname;
        el.innerHTML = `
          <span class="msg-time">${fmtTime(msg.timestamp)}</span>
          <span class="msg-nick${isSelf ? ' self' : ''}"
                data-nick="${escAttr(msg.nickname)}">${escHtml(msg.nickname)}</span>
          <span class="msg-text">${escHtml(msg.message)}</span>`;
        if (!isSelf) {
          el.querySelector('.msg-nick').addEventListener('click', e => {
            e.stopPropagation();
            showNickMenu(e, msg.nickname);
          });
        }
      }
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
    }

    function sendMessage() {
      const inp = document.getElementById('chatInput');
      const msg = inp.value.trim();
      if (!msg) return;
      socket.emit('send-message', { message: msg });
      inp.value = '';
    }

    function renderUserList(users) {
      const el = document.getElementById('usersList');
      document.getElementById('userCount').textContent = users.length;
      el.innerHTML = '';
      users.forEach(nick => {
        const isSelf = nick === state.nickname;
        const item   = document.createElement('div');
        item.className = 'user-item' + (isSelf ? ' self' : '');
        item.innerHTML = `<div class="user-dot${isSelf ? ' self' : ''}"></div>${escHtml(nick)}`;
        if (!isSelf) item.onclick = (e) => {
          e.stopPropagation();
          showNickMenu(e, nick);
        };
        el.appendChild(item);
      });
    }

    function toggleSidebar() {
      state.sidebarVisible = !state.sidebarVisible;
      document.getElementById('usersSidebar').classList.toggle('hidden', !state.sidebarVisible);
    }

    // ── Nick context menu ─────────────────────────────────────────────────
    function showNickMenu(e, nick) {
      state.menuTarget = nick;
      const menu = document.getElementById('nickMenu');
      document.getElementById('nickMenuTitle').textContent = nick;
      menu.classList.add('show');
      const x = Math.min(e.clientX, window.innerWidth - 200);
      const y = Math.min(e.clientY, window.innerHeight - 100);
      menu.style.left = x + 'px';
      menu.style.top  = y + 'px';
    }

    document.addEventListener('click', e => {
      const menu = document.getElementById('nickMenu');
      if (!menu.contains(e.target)) menu.classList.remove('show');
    });

    function openPrivate() {
      const nick = state.menuTarget;
      document.getElementById('nickMenu').classList.remove('show');
      if (!nick) return;
      socket.emit('start-private', { targetNickname: nick });
    }

    // ── Bong sound ────────────────────────────────────────────────────────
    function playBong() {
      if (soundMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const now = audioCtx.currentTime;

        // Short sharp ping
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type      = 'sine';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch(e) {}
    }

    function toggleMute(e) {
      e && e.stopPropagation();
      soundMuted = !soundMuted;
      const btn = document.getElementById('privateMuteBtn');
      btn.textContent = soundMuted ? '🔇' : '🔔';
      btn.classList.toggle('muted', soundMuted);
      btn.title = soundMuted ? t('unmuteTip') : t('muteTip');
    }

    // ── Image sharing ─────────────────────────────────────────────────────
    function pickImage() {
      document.getElementById('imageFileInput').click();
    }

    function sendImage(input) {
      const file = input.files[0];
      input.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) return showToast(t('imagesOnly'));
      if (!state.privatePrId) return;
      processImageFile(file);
    }

    // ── Drag & drop images onto private chat ──────────────────────────────
    (function() {
      const inputBar = document.querySelector('.private-input-bar');

      inputBar.addEventListener('dragenter', e => {
        e.preventDefault();
        if (hasImageFile(e.dataTransfer)) inputBar.classList.add('drag-over');
      });

      inputBar.addEventListener('dragover', e => {
        e.preventDefault();
        if (hasImageFile(e.dataTransfer)) e.dataTransfer.dropEffect = 'copy';
      });

      inputBar.addEventListener('dragleave', e => {
        // Only remove if leaving the bar entirely (not just moving between children)
        if (!inputBar.contains(e.relatedTarget)) {
          inputBar.classList.remove('drag-over');
        }
      });

      inputBar.addEventListener('drop', e => {
        e.preventDefault();
        inputBar.classList.remove('drag-over');
        if (!state.privatePrId) return showToast(t('openPrivFirst'));
        const file = Array.from(e.dataTransfer.files).find(f => f.type.startsWith('image/'));
        if (!file) return showToast(t('dropImgOnly'));
        processImageFile(file);
      });

      function hasImageFile(dt) {
        return Array.from(dt.types).includes('Files');
      }
    })();

    function processImageFile(file) {
      if (file.size > 3 * 1024 * 1024) return showToast(t('imgTooLarge'));

      const list    = document.getElementById('privateMessages');
      const sending = document.createElement('div');
      sending.className   = 'img-sending';
      sending.textContent = t('sending');
      list.appendChild(sending);
      list.scrollTop = list.scrollHeight;

      const reader  = new FileReader();
      reader.onload = e => {
        sending.remove();
        socket.emit('send-private', {
          prId:    state.privatePrId,
          message: e.target.result,
          type:    'image',
        });
      };
      reader.onerror = () => { sending.remove(); showToast(t('imgReadErr')); };
      reader.readAsDataURL(file);
    }

    function saveImage(dataUrl) {
      const ext = dataUrl.substring(dataUrl.indexOf('/') + 1, dataUrl.indexOf(';'));
      const a   = document.createElement('a');
      a.href     = dataUrl;
      a.download = `quickchat-image-${Date.now()}.${ext}`;
      a.click();
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('show');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    // ── Private chat ──────────────────────────────────────────────────────
    function showPrivatePanel(prId, withNick, messages = []) {
      state.privatePrId       = prId;
      state.privateWith       = withNick;
      state.privateCollapsed  = false;
      state.privateUnread     = 0;
      updateUnreadBadge();

      document.getElementById('privatePanelTitle').textContent = t('privateWith', withNick);
      document.getElementById('privateMessages').innerHTML     = '';
      messages.forEach(appendPrivateMsg);

      const panel = document.getElementById('privatePanel');
      panel.style.display = 'flex';
      panel.classList.remove('collapsed');
      document.getElementById('privateInput').focus();
    }

    function appendPrivateMsg(msg) {
      const list   = document.getElementById('privateMessages');
      const isSelf = msg.nickname === state.nickname;

      // Play bong for incoming messages (not your own)
      if (!isSelf) playBong();

      const el = document.createElement('div');
      el.className = 'private-msg';

      if (msg.type === 'image') {
        el.innerHTML = `<span class="pnick${isSelf ? ' self' : ''}">${escHtml(msg.nickname)}:</span>
                        <div class="private-img-wrap">
                          <img src="${msg.message}" alt="image" loading="lazy" />
                          <button class="btn-img-save" title="${t('saveImg')}">${t('saveImg')}</button>
                        </div>`;
        el.querySelector('img').addEventListener('click', () => openLightbox(msg.message));
        el.querySelector('.btn-img-save').addEventListener('click', () => saveImage(msg.message));
      } else {
        el.innerHTML = `<span class="pnick${isSelf ? ' self' : ''}">${escHtml(msg.nickname)}:</span>
                        <span class="ptext"> ${escHtml(msg.message)}</span>`;
      }

      list.appendChild(el);
      list.scrollTop = list.scrollHeight;

      if (state.privateCollapsed) {
        state.privateUnread++;
        updateUnreadBadge();
      }
    }

    function sendPrivate() {
      const inp = document.getElementById('privateInput');
      const msg = inp.value.trim();
      if (!msg || !state.privatePrId) return;
      socket.emit('send-private', { prId: state.privatePrId, message: msg });
      inp.value = '';
    }

    function togglePrivatePanel() {
      // Handled by topbar click listener in drag/resize block
    }

    function updateUnreadBadge() {
      const badge = document.getElementById('privateUnread');
      if (state.privateUnread > 0) {
        badge.textContent = state.privateUnread;
        badge.classList.add('show');
      } else {
        badge.classList.remove('show');
      }
    }

    function closePrivate(e) {
      e && e.stopPropagation();
      if (state.privatePrId) {
        socket.emit('close-private', { prId: state.privatePrId });
      }
      closePrivateFull();
    }

    function closePrivateFull() {
      state.privatePrId      = null;
      state.privateWith      = null;
      state.privateUnread    = 0;
      document.getElementById('privatePanel').style.display = 'none';
      updateUnreadBadge();
    }

    // ── Invite banner ─────────────────────────────────────────────────────
    function showInvite(prId, fromNick) {
      state.pendingInvite = { prId, fromNick };
      document.getElementById('inviteText').textContent = t('wantsChat', fromNick);
      const banner = document.getElementById('inviteBanner');
      banner.classList.add('show');
      clearTimeout(banner._t);
      banner._t = setTimeout(() => banner.classList.remove('show'), 12000);
    }

    function acceptInvite() {
      document.getElementById('inviteBanner').classList.remove('show');
      if (!state.pendingInvite) return;
      const { prId, fromNick } = state.pendingInvite;
      showPrivatePanel(prId, fromNick, []);
      state.pendingInvite = null;
    }

    function dismissInvite() {
      document.getElementById('inviteBanner').classList.remove('show');
      state.pendingInvite = null;
    }

    // ── Escape helpers ────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }
    function escAttr(str) { return escHtml(str); }

    // ── Keyboard shortcuts ────────────────────────────────────────────────
    document.getElementById('nickInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') setNickname();
    });
    document.getElementById('chatInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('privateInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrivate(); }
    });

    // ── Socket events ─────────────────────────────────────────────────────
    socket.on('room-list',        rooms => renderRooms(rooms));
    socket.on('room-list-update', rooms => renderRooms(rooms));

    socket.on('room-joined', ({ roomId, roomName, roomIcon, roomIconImage, description, messages, users }) => {
      state.currentRoom = roomId;
      const iconHtml = roomIconImage && roomIconImage.startsWith('data:image/')
        ? `<img src="${roomIconImage}" alt="" style="width:1.4rem;height:1.4rem;border-radius:4px;object-fit:cover;vertical-align:middle;">`
        : escHtml(roomIcon);
      document.getElementById('chatRoomTitle').innerHTML =
        `${iconHtml} ${escHtml(roomName)}<small>${escHtml(description)}</small>`;
      document.getElementById('messagesList').innerHTML = '';
      messages.forEach(appendMessage);
      renderUserList(users);
      showScreen('chatroom');
      document.getElementById('chatInput').focus();
    });

    socket.on('join-error', msg => showToast(msg));
    socket.on('chat-error', msg => showToast(msg));
    socket.on('error',      msg => showToast(msg));

    socket.on('new-message', msg => appendMessage(msg));

    socket.on('user-list', users => renderUserList(users));

    socket.on('private-started', ({ prId, withNickname, messages }) => {
      showPrivatePanel(prId, withNickname, messages);
    });

    socket.on('private-invited', ({ prId, fromNickname }) => {
      // Only show invite if not already in a private with this person
      if (state.privatePrId !== prId) showInvite(prId, fromNickname);
    });

    socket.on('new-private-message', ({ prId, msg }) => {
      if (prId === state.privatePrId) {
        appendPrivateMsg(msg);
      } else {
        // Different private? Show invite
        if (!state.privateOpen) showInvite(prId, msg.nickname);
      }
    });

    socket.on('private-closed', ({ byNickname }) => {
      showToast(t('closed', byNickname));
      closePrivateFull();
    });

    socket.on('room-updated', ({ roomId, name, icon, iconImage, description }) => {
      if (state.currentRoom === roomId) {
        const iconHtml = iconImage && iconImage.startsWith('data:image/')
          ? `<img src="${iconImage}" alt="" style="width:1.4rem;height:1.4rem;border-radius:4px;object-fit:cover;vertical-align:middle;">`
          : escHtml(icon);
        document.getElementById('chatRoomTitle').innerHTML =
          `${iconHtml} ${escHtml(name)}<small>${escHtml(description)}</small>`;
      }
    });

    socket.on('kicked', () => {
      showToast(t('adminCleared'));
      leaveRoom();
    });

    // ── i18n ─────────────────────────────────────────────────────────────
    const LANGS = {

    let currentLang = sessionStorage.getItem('quickchat_lang') || 'da';

    function t(key, ...args) {
      const val = LANGS[currentLang][key];
      return typeof val === 'function' ? val(...args) : val;
    }

    function applyLang() {
      const L = LANGS[currentLang];
      // Header
      document.getElementById('tagline').textContent        = L.tagline;
      document.getElementById('welcomeStrip').innerHTML     = L.welcome;
      document.getElementById('nickInput').placeholder      = L.nickPlaceholder;
      document.getElementById('btnSetName').textContent     = L.setName;
      document.getElementById('roomsHeading').textContent   = L.chooseRoom;
      // Chat room
      document.getElementById('btnBack').textContent        = L.back;
      document.getElementById('btnSend').textContent        = L.send;
      document.getElementById('sidebarHead').textContent    = L.inThisRoom;
      document.getElementById('chatInput').placeholder = L.typeMsg;
      // Private panel
      document.getElementById('privatePanelTitle').textContent = L.privatePanel;
      document.getElementById('privateInput').placeholder = L.privateMsg;
      document.getElementById('btnPrivateSend').textContent    = L.privateSend;
      document.getElementById('btnImage').textContent          = L.sendImage;
      document.getElementById('btnAccept').textContent         = L.accept;
      document.getElementById('btnDismiss').textContent        = L.dismiss;
      const muteBtn = document.getElementById('privateMuteBtn');
      if (muteBtn) muteBtn.title = soundMuted ? L.unmuteTip : L.muteTip;
      document.getElementById('btnHow').textContent = L.howBtn;
      // Language toggle buttons
      document.getElementById('langDa').classList.toggle('active', currentLang === 'da');
      document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
      // Update save image buttons already in DOM
      document.querySelectorAll('.btn-img-save').forEach(b => b.textContent = L.saveImg);
    }

    function openHiw() {
      const L = LANGS[currentLang];
      document.getElementById('hiwTitle').textContent    = L.hiwTitle;
      document.getElementById('hiwSubtitle').textContent = L.hiwSubtitle;
      const body = document.getElementById('hiwBody');
      body.innerHTML = L.hiwSections.map(s => `
        <div class="hiw-section">
          <div class="hiw-section-title">
            <div class="hiw-icon">${s.icon}</div>
            ${s.title}
          </div>
          <p>${s.text}</p>
        </div>
      `).join('<hr class="hiw-divider">') +
      `<hr class="hiw-divider"><div class="hiw-footer">${L.hiwFooter}</div>`;
      document.getElementById('hiwOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeHiw(e) {
      if (e && e.target !== document.getElementById('hiwOverlay')) return;
      document.getElementById('hiwOverlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    // Close on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeHiw();
    });

    function setLang(lang) {
      currentLang = lang;
      sessionStorage.setItem('quickchat_lang', lang);
      applyLang();
    }

    // Restore nickname and language, then apply
    const savedNick = sessionStorage.getItem('quickchat_nick');
    if (savedNick) {
      state.nickname = savedNick;
      document.getElementById('nickInput').value = savedNick;
    }
    applyLang();
    socket.emit('get-rooms');

    // ── Drag & Resize private panel ───────────────────────────────────────
    (function() {
      const panel = document.getElementById('privatePanel');
      const topbar = panel.querySelector('.private-topbar');

      // ── Drag by title bar ─────────────────────────────────────────────
      let dragging = false, dragMoved = false;
      let dragStartX, dragStartY, panelStartRight, panelStartBottom;
      let savedHeight = '420px';

      topbar.addEventListener('mousedown', e => {
        if (e.target.classList.contains('private-close')) return;
        dragging  = true;
        dragMoved = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        const rect = panel.getBoundingClientRect();
        panelStartRight  = window.innerWidth  - rect.right;
        panelStartBottom = window.innerHeight - rect.bottom;
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        // Only start moving if mouse moved more than 4px (avoids accidental drag on click)
        if (!dragMoved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        dragMoved = true;
        const newRight  = Math.max(0, panelStartRight  - dx);
        const newBottom = Math.max(0, panelStartBottom - dy);
        panel.style.right  = newRight  + 'px';
        panel.style.bottom = newBottom + 'px';
      });

      document.addEventListener('mouseup', () => { dragging = false; });

      // Override the topbar click toggle — only collapse if we didn't drag
      topbar.addEventListener('click', e => {
        if (e.target.classList.contains('private-close')) return;
        if (dragMoved) return; // was a drag, not a click
        // Toggle collapse
        state.privateCollapsed = !state.privateCollapsed;
        panel.classList.toggle('collapsed', state.privateCollapsed);
        if (!state.privateCollapsed) {
          // Restore saved height
          panel.style.height = savedHeight;
          state.privateUnread = 0;
          updateUnreadBadge();
          const list = document.getElementById('privateMessages');
          list.scrollTop = list.scrollHeight;
        } else {
          // Save current height before collapsing
          if (!panel.classList.contains('collapsed')) {
            savedHeight = panel.style.height || '420px';
          }
        }
      });

      // ── Resize by handles ─────────────────────────────────────────────
      let resizing = false, resizeDir;
      let resStartX, resStartY, resStartW, resStartH, resStartRight, resStartBottom;

      panel.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', e => {
          resizing   = true;
          resizeDir  = handle.dataset.dir;
          resStartX  = e.clientX;
          resStartY  = e.clientY;
          const rect = panel.getBoundingClientRect();
          resStartW  = rect.width;
          resStartH  = rect.height;
          resStartRight  = window.innerWidth  - rect.right;
          resStartBottom = window.innerHeight - rect.bottom;
          e.preventDefault();
          e.stopPropagation();
        });
      });

      document.addEventListener('mousemove', e => {
        if (!resizing) return;
        const dx = e.clientX - resStartX;
        const dy = e.clientY - resStartY;

        if (resizeDir.includes('w')) {
          const newW = Math.max(240, resStartW - dx);
          panel.style.width = newW + 'px';
          panel.style.right = (resStartRight + (resStartW - newW)) + 'px';
        }
        if (resizeDir.includes('n')) {
          const newH = Math.max(200, resStartH - dy);
          panel.style.height = newH + 'px';
          savedHeight = newH + 'px';
        }
        if (resizeDir === 'ne') {
          const newW = Math.max(240, resStartW + dx);
          panel.style.width = newW + 'px';
        }
      });

      document.addEventListener('mouseup', () => { resizing = false; });
    })();

    // Public API
    // ── Load ads dynamically ──────────────────────────────────────────────
    (async function loadAds() {
      try {
        const res  = await fetch('/ads.json');
        const ads  = await res.json();
        const setAd = (id, html) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (html && html.trim()) {
            el.innerHTML = html;
            // Re-execute any <script> tags in the ad HTML
            el.querySelectorAll('script').forEach(old => {
              const s = document.createElement('script');
              if (old.src) s.src = old.src; else s.textContent = old.textContent;
              document.head.appendChild(s);
            });
          }
        };
        setAd('adLeft',  ads.left);
        setAd('adRight', ads.right);
      } catch(e) { /* Ingen reklamer — behold placeholder */ }
    })();

    return {
      setNickname, joinRoom, leaveRoom, sendMessage,
      toggleSidebar, showNickMenu, openPrivate,
      sendPrivate, togglePrivatePanel, closePrivate,
      acceptInvite, dismissInvite,
      pickImage, sendImage, saveImage, closeLightbox,
      toggleMute, setLang, openHiw, closeHiw,
    };
  })();
