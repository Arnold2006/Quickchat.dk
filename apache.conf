# ─────────────────────────────────────────────────────────────────────────────
# Apache VirtualHost — QuickChat reverse proxy
# Save to: /etc/apache2/sites-available/quickchat.conf
# (In aapanel: Website → Add Site → set domain, then edit Nginx/Apache config)
#
# Requirements: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite
#   Enable with: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# ─────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName   chat.tera-sat.com
    ServerAlias  www.chat.tera-sat.com

    # ── Logging ───────────────────────────────────────────────────────────
    ErrorLog  /www/wwwlogs/quickchat-error.log
    CustomLog /www/wwwlogs/quickchat-access.log combined

    # ── Proxy settings ────────────────────────────────────────────────────
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyVia          On

    # Forward real client IP to Node.js
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto http

    # ── WebSocket upgrade (required for Socket.io) ────────────────────────
    RewriteEngine On

    # Route WebSocket handshake
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://localhost:3000/$1 [P,L]

    # Route everything else through HTTP proxy
    ProxyPass        / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # ── Timeouts ──────────────────────────────────────────────────────────
    ProxyTimeout          300
    ProxyBadHeader        Ignore
</VirtualHost>

